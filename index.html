<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Nando's AI — Plataforma de conversação minimalista com IA" />
  <title>Nando's AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            border: "hsl(var(--border))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            primary: {
              DEFAULT: "hsl(var(--primary))",
              foreground: "hsl(var(--primary-foreground))",
            },
            secondary: {
              DEFAULT: "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            muted: {
              DEFAULT: "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            accent: {
              DEFAULT: "hsl(var(--accent))",
              foreground: "hsl(var(--accent-foreground))",
            },
            card: {
              DEFAULT: "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
          },
          borderRadius: {
            lg: "var(--radius)",
            md: "calc(var(--radius) - 2px)",
            sm: "calc(var(--radius) - 4px)",
          },
        },
      },
    }
  </script>
  <style>
    :root {
      --background: 220 25% 76%;
      --foreground: 220 12% 39%;
      --card: 220 25% 76%;
      --card-foreground: 220 12% 39%;
      --primary: 220 12% 39%;
      --primary-foreground: 0 0% 100%;
      --secondary: 220 20% 90%;
      --secondary-foreground: 220 12% 39%;
      --muted: 220 20% 90%;
      --muted-foreground: 220 12% 55%;
      --accent: 220 20% 90%;
      --accent-foreground: 220 12% 39%;
      --border: 0 0% 100%;
      --input: 0 0% 100%;
      --ring: 220 12% 39%;
      --radius: 0.75rem;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(93, 97, 105, 0.4) transparent;
    }

    *::-webkit-scrollbar {
      width: 6px;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background-color: rgba(93, 97, 105, 0.4);
      border-radius: 20px;
    }

    html {
      scroll-behavior: smooth;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.3s ease-out forwards;
    }

    @keyframes pulseRing {
      0% {
        transform: scale(1);
        opacity: 0.6;
      }

      50% {
        transform: scale(1.35);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 0;
      }
    }

    .animate-pulse-ring {
      animation: pulseRing 1.5s ease-out infinite;
    }

    @keyframes waveBar {

      0%,
      100% {
        height: 6px;
      }

      50% {
        height: 20px;
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
</head>

<body class="font-sans antialiased"
  style="background: radial-gradient(ellipse at top left, rgba(157,174,208,1) 0%, rgba(228,224,220,1) 100%); min-height: 100vh;">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
